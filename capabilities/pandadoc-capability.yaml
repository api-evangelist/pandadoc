      - name: listdocuments
        method: GET
        description: List Documents
        inputParameters:
        - name: template_id
          in: query
          type: string
          description: Filter by the parent template identifier.
        - name: form_id
          in: query
          type: string
          description: Filter by the parent form identifier.
        - name: folder_uuid
          in: query
          type: string
          description: Filter by the folder where documents are stored.
        - name: contact_id
          in: query
          type: string
          description: Filter by recipient or approver contact identifier.
        - name: status
          in: query
          type: string
          description: Filter by document status.
        - name: tag
          in: query
          type: string
          description: Filter by document tag (exact match).
        - name: q
          in: query
          type: string
          description: Search by document name substring.
        - name: id
          in: query
          type: string
          description: Filter by a specific document identifier.
        - name: owner_id
          in: query
          type: string
          description: Filter by the document owner member identifier.
        - name: order_by
          in: query
          type: string
          description: Sort field for results.
        - name: asc
          in: query
          type: boolean
          description: Set to true for ascending order, false for descending.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdocument
        method: POST
        description: Create Document
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
