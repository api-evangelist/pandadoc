naftiko: 1.0.0-alpha2
info:
  label: PandaDoc REST API — API Logs
  description: 'PandaDoc REST API — API Logs. 1 operations. Lead operation: List API Logs. Self-contained Naftiko capability
    covering one Pandadoc business surface.'
  tags:
  - Pandadoc
  - API Logs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PANDADOC_API_KEY: PANDADOC_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-api-logs
    baseUri: https://api.pandadoc.com/public/v1
    description: PandaDoc REST API — API Logs business capability. Self-contained, no shared references.
    resources:
    - name: logs
      path: /logs
      operations:
      - name: listapilogs
        method: GET
        description: List API Logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PANDADOC_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-api-logs-rest
    port: 8080
    description: REST adapter for PandaDoc REST API — API Logs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/logs
      name: logs
      description: REST surface for logs.
      operations:
      - method: GET
        name: listapilogs
        description: List API Logs
        call: rest-api-logs.listapilogs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-api-logs-mcp
    port: 9090
    transport: http
    description: MCP adapter for PandaDoc REST API — API Logs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-api-logs
      description: List API Logs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-api-logs.listapilogs
      outputParameters:
      - type: object
        mapping: $.
