naftiko: 1.0.0-alpha2
info:
  label: PandaDoc REST API — Document Fields
  description: 'PandaDoc REST API — Document Fields. 2 operations. Lead operation: List Document Fields. Self-contained Naftiko
    capability covering one Pandadoc business surface.'
  tags:
  - Pandadoc
  - Document Fields
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PANDADOC_API_KEY: PANDADOC_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-document-fields
    baseUri: https://api.pandadoc.com/public/v1
    description: PandaDoc REST API — Document Fields business capability. Self-contained, no shared references.
    resources:
    - name: documents-id-fields
      path: /documents/{id}/fields
      operations:
      - name: listdocumentfields
        method: GET
        description: List Document Fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatedocumentfields
        method: PATCH
        description: Update Document Fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PANDADOC_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-document-fields-rest
    port: 8080
    description: REST adapter for PandaDoc REST API — Document Fields. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/documents/{id}/fields
      name: documents-id-fields
      description: REST surface for documents-id-fields.
      operations:
      - method: GET
        name: listdocumentfields
        description: List Document Fields
        call: rest-document-fields.listdocumentfields
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatedocumentfields
        description: Update Document Fields
        call: rest-document-fields.updatedocumentfields
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-document-fields-mcp
    port: 9090
    transport: http
    description: MCP adapter for PandaDoc REST API — Document Fields. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-document-fields
      description: List Document Fields
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-document-fields.listdocumentfields
      outputParameters:
      - type: object
        mapping: $.
    - name: update-document-fields
      description: Update Document Fields
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-document-fields.updatedocumentfields
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
