naftiko: 1.0.0-alpha2
info:
  label: PandaDoc REST API — Workspaces
  description: 'PandaDoc REST API — Workspaces. 2 operations. Lead operation: List Workspaces. Self-contained Naftiko capability
    covering one Pandadoc business surface.'
  tags:
  - Pandadoc
  - Workspaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PANDADOC_API_KEY: PANDADOC_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-workspaces
    baseUri: https://api.pandadoc.com/public/v1
    description: PandaDoc REST API — Workspaces business capability. Self-contained, no shared references.
    resources:
    - name: workspaces
      path: /workspaces
      operations:
      - name: listworkspaces
        method: GET
        description: List Workspaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createworkspace
        method: POST
        description: Create Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PANDADOC_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-workspaces-rest
    port: 8080
    description: REST adapter for PandaDoc REST API — Workspaces. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/workspaces
      name: workspaces
      description: REST surface for workspaces.
      operations:
      - method: GET
        name: listworkspaces
        description: List Workspaces
        call: rest-workspaces.listworkspaces
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createworkspace
        description: Create Workspace
        call: rest-workspaces.createworkspace
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-workspaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for PandaDoc REST API — Workspaces. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-workspaces
      description: List Workspaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-workspaces.listworkspaces
      outputParameters:
      - type: object
        mapping: $.
    - name: create-workspace
      description: Create Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-workspaces.createworkspace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
