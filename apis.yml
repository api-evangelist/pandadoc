aid: pandadoc
name: PandaDoc
description: PandaDoc is a document automation platform that enables businesses to
  create, send, track, and e-sign documents programmatically. Their developer platform
  provides REST APIs and embedded tools for integrating document generation, e-signature
  collection, and workflow automation directly into third-party applications.
